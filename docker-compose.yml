services:
  db:
    image: postgres:17-alpine
    container_name: mmhotel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmhotel
      POSTGRES_PASSWORD: mmhotel
      POSTGRES_DB: mmhotel
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmhotel -d mmhotel"]
      interval: 5s
      timeout: 5s
      retries: 10
